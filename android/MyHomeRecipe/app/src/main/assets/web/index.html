<!DOCTYPE html>
<html lang="zh-CN">
  <head>

        align-items: center;
        justify-content: center;
        padding: 0 1.5rem;
        background: #f6f1e9;
        color: #5b4b3a;
        font-family:

          'Microsoft YaHei',

      .card .dish {

        margin-bottom: 0.75rem;
